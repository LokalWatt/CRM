<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lokalwatt CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16181d;
    --paper:#f4f5f7;
    --surface:#ffffff;
    --muted:#6b7280;
    --line:#e5e7eb;
    --watt:#f6a800;
    --watt-deep:#d98e00;
    --won:#1f9d63;
    --lost:#c7443b;
    --radius:12px;
    --shadow:0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.05);
    --shadow-lift:0 8px 24px rgba(16,24,40,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    color:var(--ink);
    background:var(--paper);
    display:flex;flex-direction:column;height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer}

  /* ---------- Kopfzeile ---------- */
  header{
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:14px 20px;background:var(--surface);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:10px;margin-right:auto}
  .bolt{
    width:34px;height:34px;border-radius:9px;
    background:var(--ink);display:grid;place-items:center;flex:0 0 auto;
  }
  .bolt svg{width:19px;height:19px}
  .brand h1{
    font-family:"Bricolage Grotesque",sans-serif;
    font-weight:700;font-size:20px;letter-spacing:-.02em;margin:0;line-height:1;
  }
  .brand span{display:block;font-size:11px;color:var(--muted);margin-top:3px;font-weight:500}

  .search{
    position:relative;flex:1 1 220px;max-width:340px;
  }
  .search input{
    width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);
    border-radius:9px;font-size:14px;background:var(--paper);color:var(--ink);outline:none;
  }
  .search input:focus{border-color:var(--watt);background:#fff;box-shadow:0 0 0 3px rgba(246,168,0,.15)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}

  .btn{
    border:1px solid var(--line);background:var(--surface);color:var(--ink);
    padding:9px 13px;border-radius:9px;font-size:13px;font-weight:600;
    display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
  }
  .btn:hover{background:var(--paper)}
  .btn svg{width:15px;height:15px}
  .btn-primary{background:var(--watt);border-color:var(--watt);color:var(--ink)}
  .btn-primary:hover{background:var(--watt-deep);border-color:var(--watt-deep)}
  .btn-ghost{border-color:transparent;background:transparent;color:var(--muted);padding:9px}
  .btn-ghost:hover{background:var(--paper);color:var(--ink)}

  /* ---------- Board ---------- */
  .board{
    flex:1;display:flex;gap:14px;overflow-x:auto;overflow-y:hidden;
    padding:18px 20px 22px;align-items:flex-start;scroll-behavior:smooth;
  }
  .col{
    flex:0 0 288px;width:288px;max-height:100%;
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);display:flex;flex-direction:column;
    overflow:hidden;
  }
  .col-head{
    padding:12px 14px 11px;border-top:3px solid var(--stage,#9aa0a6);
    display:flex;align-items:baseline;gap:8px;
  }
  .col-head h2{font-size:13.5px;font-weight:600;margin:0;letter-spacing:-.01em}
  .col-count{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
  .col-body{
    flex:1;overflow-y:auto;padding:4px 10px 10px;display:flex;flex-direction:column;gap:9px;min-height:60px;
  }
  .col-body.drop{background:rgba(246,168,0,.08);outline:2px dashed var(--watt);outline-offset:-6px;border-radius:8px}

  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:10px;
    padding:11px 12px;box-shadow:var(--shadow);cursor:grab;
    transition:box-shadow .12s ease, transform .12s ease;position:relative;
  }
  .card:hover{box-shadow:var(--shadow-lift)}
  .card.dragging{opacity:.45;cursor:grabbing}
  .card .firma{font-weight:600;font-size:14px;letter-spacing:-.01em;line-height:1.3;word-break:break-word}
  .card .row{display:flex;align-items:flex-start;gap:6px;font-size:12.5px;color:#3a3f47;margin-top:5px;line-height:1.35}
  .card .row .ic{width:14px;height:14px;flex:0 0 auto;color:var(--muted);margin-top:1px}
  .card .row span{word-break:break-word}
  .card .foot{display:flex;align-items:center;gap:8px;margin-top:10px}
  .card .nav{margin-left:auto;display:flex;gap:2px}
  .nav button{
    width:24px;height:24px;border:1px solid var(--line);background:#fff;border-radius:6px;
    display:grid;place-items:center;color:var(--muted);padding:0;
  }
  .nav button:hover:not(:disabled){color:var(--ink);border-color:var(--muted)}
  .nav button:disabled{opacity:.3;cursor:default}
  .nav svg{width:13px;height:13px}

  .empty-col{font-size:12px;color:var(--muted);text-align:center;padding:14px 6px;line-height:1.5}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(16,24,40,.42);
    display:none;align-items:flex-start;justify-content:center;padding:32px 16px;z-index:50;
    overflow-y:auto;
  }
  .overlay.open{display:flex}
  .modal{
    background:var(--surface);border-radius:16px;width:100%;max-width:480px;
    box-shadow:var(--shadow-lift);overflow:hidden;margin:auto;
  }
  .modal-head{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center}
  .modal-head h3{margin:0;font-family:"Bricolage Grotesque",sans-serif;font-size:18px;font-weight:700;letter-spacing:-.02em}
  .modal-body{padding:16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field.full{grid-column:1 / -1}
  .field label{font-size:12px;font-weight:600;color:var(--muted)}
  .field input,.field select,.field textarea{
    border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14px;
    font-family:inherit;color:var(--ink);background:var(--surface);outline:none;width:100%;
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--watt);box-shadow:0 0 0 3px rgba(246,168,0,.15)}
  .field textarea{resize:vertical;min-height:62px}
  .modal-foot{padding:14px 20px 18px;display:flex;gap:10px;align-items:center;border-top:1px solid var(--line)}
  .modal-foot .btn-primary{margin-left:auto}
  .link-del{color:var(--lost);background:none;border:none;font-size:13px;font-weight:600;padding:6px}
  .link-del:hover{text-decoration:underline}

  /* ---------- Leerer Zustand ---------- */
  .blank{margin:auto;text-align:center;max-width:340px;padding:40px 20px}
  .blank .bolt{width:52px;height:52px;margin:0 auto 16px}
  .blank .bolt svg{width:28px;height:28px}
  .blank h2{font-family:"Bricolage Grotesque",sans-serif;font-size:22px;margin:0 0 8px;letter-spacing:-.02em}
  .blank p{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 20px}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:500;
    opacity:0;pointer-events:none;transition:all .25s ease;z-index:60;box-shadow:var(--shadow-lift);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:560px){
    .modal-body{grid-template-columns:1fr}
    header{padding:12px 14px;gap:10px}
    .board{padding:14px}
    .brand span{display:none}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="bolt">
      <svg viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z" fill="#f6a800"/></svg>
    </div>
    <div>
      <h1>Lokalwatt</h1>
      <span>B2B-Vertriebspipeline</span>
    </div>
  </div>

  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="search" type="search" placeholder="Firma, Ansprechpartner oder Adresse suchen…" autocomplete="off">
  </div>

  <button class="btn btn-ghost" id="btnImport" title="Daten importieren">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg>
  </button>
  <button class="btn btn-ghost" id="btnExport" title="Sicherung herunterladen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21V9m0 0-4 4m4-4 4 4M5 3h14"/></svg>
  </button>
  <button class="btn btn-primary" id="btnAdd">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
    Kontakt
  </button>
  <input type="file" id="fileInput" accept="application/json" hidden>
</header>

<div class="board" id="board"></div>

<!-- Kontakt-Formular -->
<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head"><h3 id="modalTitle">Neuer Kontakt</h3></div>
    <div class="modal-body">
      <div class="field full">
        <label for="f_firma">Firma *</label>
        <input id="f_firma" type="text" placeholder="z. B. Bäckerei Sonnenschein GmbH">
      </div>
      <div class="field">
        <label for="f_person">Ansprechpartner</label>
        <input id="f_person" type="text" placeholder="Vor- und Nachname">
      </div>
      <div class="field">
        <label for="f_position">Position</label>
        <input id="f_position" type="text" placeholder="z. B. Geschäftsführung">
      </div>
      <div class="field">
        <label for="f_email">E-Mail</label>
        <input id="f_email" type="email" placeholder="name@firma.de">
      </div>
      <div class="field">
        <label for="f_tel">Telefon</label>
        <input id="f_tel" type="tel" placeholder="+49 …">
      </div>
      <div class="field">
        <label for="f_web">Website</label>
        <input id="f_web" type="text" placeholder="firma.de">
      </div>
      <div class="field full">
        <label for="f_objekt">Objektadresse</label>
        <input id="f_objekt" type="text" placeholder="Straße Nr., PLZ Ort">
      </div>
      <div class="field">
        <label for="f_stage">Stage</label>
        <select id="f_stage"></select>
      </div>
      <div class="field full">
        <label for="f_notiz">Notizen</label>
        <textarea id="f_notiz" placeholder="Gesprächsnotizen, nächste Schritte …"></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button class="link-del" id="btnDelete" style="display:none">Löschen</button>
      <button class="btn" id="btnCancel">Abbrechen</button>
      <button class="btn btn-primary" id="btnSave">Speichern</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   Lokalwatt CRM – reines Vanilla-JS, keine Abhängigkeiten.
   Daten liegen lokal im Browser (localStorage).
   Über Export/Import kannst du sichern und Geräte wechseln.
   ========================================================= */

// Stages der Pipeline – hier kannst du sie umbenennen/ergänzen.
const STAGES = [
  { id:"kontaktiert", name:"Kontaktiert",             color:"#4c8bf5" },
  { id:"termin",      name:"Vor-Ort-Termin vereinbart", color:"#7c5cff" },
  { id:"offerte",     name:"Offerte erstellen",       color:"#f6a800" },
  { id:"gewonnen",    name:"Gewonnen",                color:"#1f9d63" },
  { id:"spaeter",     name:"Später kontaktieren",     color:"#9aa0a6" },
  { id:"nichtint",    name:"Nicht interessiert",      color:"#c7443b" },
];

const KEY = "lokalwatt_crm_v1";
let contacts = [];
let memoryOnly = false;          // Fallback, falls localStorage gesperrt ist (z. B. Vorschau)
let editingId = null;

/* ---------- Speicher ---------- */
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    contacts = raw ? JSON.parse(raw) : [];
  }catch(e){
    memoryOnly = true;
    contacts = [];
  }
}
function save(){
  try{
    if(!memoryOnly) localStorage.setItem(KEY, JSON.stringify(contacts));
  }catch(e){
    memoryOnly = true; // still im Speicher halten
  }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

/* ---------- Rendern ---------- */
const board = document.getElementById("board");

function render(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  const visible = contacts.filter(c=>{
    if(!q) return true;
    return (c.firma||"").toLowerCase().includes(q)
        || (c.person||"").toLowerCase().includes(q)
        || (c.objekt||"").toLowerCase().includes(q);
  });

  if(contacts.length === 0){
    board.innerHTML = `
      <div class="blank">
        <div class="bolt"><svg viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z" fill="#f6a800"/></svg></div>
        <h2>Noch keine Kontakte</h2>
        <p>Leg deinen ersten B2B-Kontakt an und zieh ihn durch die Pipeline – vom ersten Lead bis zum gewonnenen Auftrag.</p>
        <button class="btn btn-primary" onclick="openModal()">Ersten Kontakt anlegen</button>
      </div>`;
    return;
  }

  board.innerHTML = "";
  STAGES.forEach((stage, si)=>{
    const items = visible.filter(c=>c.stage === stage.id);

    const col = document.createElement("div");
    col.className = "col";
    col.style.setProperty("--stage", stage.color);
    col.innerHTML = `
      <div class="col-head">
        <h2>${stage.name}</h2>
        <span class="col-count">${items.length}</span>
      </div>
      <div class="col-body" data-stage="${stage.id}"></div>`;

    const body = col.querySelector(".col-body");

    if(items.length === 0){
      body.innerHTML = `<div class="empty-col">Karten hierher ziehen</div>`;
    }else{
      items.forEach(c=>{
        const card = document.createElement("div");
        card.className = "card";
        card.draggable = true;
        card.dataset.id = c.id;
        const personRow = c.person ? `
          <div class="row">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.3 3.1-6 7-6s7 2.7 7 6"/></svg>
            <span>${esc(c.person)}</span>
          </div>` : "";
        const adrRow = c.objekt ? `
          <div class="row">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-6-5.3-6-10a6 6 0 1 1 12 0c0 4.7-6 10-6 10z"/><circle cx="12" cy="11" r="2.2"/></svg>
            <span>${esc(c.objekt)}</span>
          </div>` : "";
        card.innerHTML = `
          <div class="firma">${esc(c.firma||"—")}</div>
          ${personRow}
          ${adrRow}
          <div class="foot">
            <div class="nav">
              <button title="Zurück" ${si===0?"disabled":""} data-move="-1">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 6 9 12l6 6"/></svg>
              </button>
              <button title="Weiter" ${si===STAGES.length-1?"disabled":""} data-move="1">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 6 6 6-6 6"/></svg>
              </button>
            </div>
          </div>`;

        // Klick auf Karte -> bearbeiten (aber nicht auf die Pfeile)
        card.addEventListener("click", e=>{
          if(e.target.closest(".nav")) return;
          openModal(c.id);
        });
        // Pfeile: eine Stage vor/zurück
        card.querySelectorAll("[data-move]").forEach(b=>{
          b.addEventListener("click", e=>{
            e.stopPropagation();
            moveStage(c.id, parseInt(b.dataset.move,10));
          });
        });
        // Drag & Drop (Desktop)
        card.addEventListener("dragstart", e=>{
          card.classList.add("dragging");
          e.dataTransfer.setData("text/plain", c.id);
          e.dataTransfer.effectAllowed = "move";
        });
        card.addEventListener("dragend", ()=>card.classList.remove("dragging"));

        body.appendChild(card);
      });
    }

    // Drop-Ziele
    body.addEventListener("dragover", e=>{ e.preventDefault(); body.classList.add("drop"); });
    body.addEventListener("dragleave", ()=>body.classList.remove("drop"));
    body.addEventListener("drop", e=>{
      e.preventDefault(); body.classList.remove("drop");
      const id = e.dataTransfer.getData("text/plain");
      const c = contacts.find(x=>x.id===id);
      if(c && c.stage !== stage.id){ c.stage = stage.id; save(); render(); }
    });

    board.appendChild(col);
  });
}

function esc(s){ return String(s).replace(/[&<>"]/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }

function moveStage(id, dir){
  const c = contacts.find(x=>x.id===id); if(!c) return;
  const i = STAGES.findIndex(s=>s.id===c.stage);
  const ni = i + dir;
  if(ni < 0 || ni >= STAGES.length) return;
  c.stage = STAGES[ni].id; save(); render();
}

/* ---------- Modal ---------- */
const overlay = document.getElementById("overlay");
const f = id => document.getElementById(id);

function fillStageSelect(){
  f("f_stage").innerHTML = STAGES.map(s=>`<option value="${s.id}">${s.name}</option>`).join("");
}

function openModal(id){
  editingId = id || null;
  fillStageSelect();
  const c = id ? contacts.find(x=>x.id===id) : null;
  f("modalTitle").textContent = c ? "Kontakt bearbeiten" : "Neuer Kontakt";
  f("btnDelete").style.display = c ? "inline-block" : "none";
  f("f_firma").value    = c?.firma    || "";
  f("f_person").value   = c?.person   || "";
  f("f_position").value = c?.position || "";
  f("f_email").value    = c?.email    || "";
  f("f_tel").value      = c?.tel      || "";
  f("f_web").value      = c?.web      || "";
  f("f_objekt").value   = c?.objekt   || "";
  f("f_stage").value    = c?.stage    || STAGES[0].id;
  f("f_notiz").value    = c?.notiz    || "";
  overlay.classList.add("open");
  setTimeout(()=>f("f_firma").focus(),50);
}
function closeModal(){ overlay.classList.remove("open"); editingId=null; }

function saveContact(){
  const firma = f("f_firma").value.trim();
  if(!firma){ f("f_firma").focus(); toast("Bitte einen Firmennamen eingeben."); return; }
  const payload = {
    firma,
    person:   f("f_person").value.trim(),
    position: f("f_position").value.trim(),
    email:    f("f_email").value.trim(),
    tel:      f("f_tel").value.trim(),
    web:      f("f_web").value.trim(),
    objekt:   f("f_objekt").value.trim(),
    stage:    f("f_stage").value,
    notiz:    f("f_notiz").value.trim(),
  };
  if(editingId){
    const c = contacts.find(x=>x.id===editingId);
    Object.assign(c, payload);
  }else{
    contacts.unshift({ id:uid(), createdAt:Date.now(), ...payload });
  }
  save(); render(); closeModal();
  toast(memoryOnly ? "Gespeichert (nur in dieser Sitzung – siehe Hinweis)" : "Gespeichert");
}

function deleteContact(){
  if(!editingId) return;
  if(!confirm("Diesen Kontakt wirklich löschen?")) return;
  contacts = contacts.filter(x=>x.id!==editingId);
  save(); render(); closeModal(); toast("Kontakt gelöscht");
}

/* ---------- Export / Import ---------- */
function exportData(){
  const blob = new Blob([JSON.stringify(contacts,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "lokalwatt-crm-" + new Date().toISOString().slice(0,10) + ".json";
  a.click(); URL.revokeObjectURL(a.href);
  toast("Sicherung heruntergeladen");
}
function importData(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!Array.isArray(data)) throw 0;
      if(contacts.length && !confirm("Bestehende Kontakte durch die Sicherung ersetzen?")) return;
      contacts = data.map(c=>({ id:c.id||uid(), stage:c.stage||STAGES[0].id, ...c }));
      save(); render(); toast(contacts.length + " Kontakte importiert");
    }catch(e){ toast("Datei konnte nicht gelesen werden."); }
  };
  reader.readAsText(file);
}

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2600);
}

/* ---------- Ereignisse ---------- */
document.getElementById("btnAdd").addEventListener("click", ()=>openModal());
document.getElementById("btnSave").addEventListener("click", saveContact);
document.getElementById("btnCancel").addEventListener("click", closeModal);
document.getElementById("btnDelete").addEventListener("click", deleteContact);
document.getElementById("btnExport").addEventListener("click", exportData);
document.getElementById("btnImport").addEventListener("click", ()=>document.getElementById("fileInput").click());
document.getElementById("fileInput").addEventListener("change", e=>{ if(e.target.files[0]) importData(e.target.files[0]); e.target.value=""; });
document.getElementById("search").addEventListener("input", render);
overlay.addEventListener("click", e=>{ if(e.target===overlay) closeModal(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

/* ---------- Start ---------- */
load();
render();
if(memoryOnly){
